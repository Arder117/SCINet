# SCINet joint super-resolution + tiny target detection training template
name: train_SCINet_detection_x4
model_type: SCINetDetectionModel
scale: 4
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: UAV_train_det
    # NOTE:
    # - PairedImageDataset only returns {lq, gt}.
    # - To train detection heads, your dataset must additionally provide:
    #   gt_heatmap, gt_size, gt_offset, gt_mask.
    # Replace this dataset type with your custom detection dataset implementation.
    type: PairedImageDataset
    dataroot_gt: ./data/train/gt
    dataroot_lq: ./data/train/lq
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: UAV_val_det
    type: PairedImageDataset
    dataroot_gt: ./data/val/gt
    dataroot_lq: ./data/val/lq
    io_backend:
      type: disk

network_g:
  type: SCINetSmallTargetDetector
  num_in_ch: 3
  num_feat: 64
  num_block: 8
  num_out_ch: 3
  upscale: 4
  conv: BSConvU
  upsampler: pixelshuffledirect
  p: 0.25
  detector_feat: 96
  num_classes: 1

path:
  # Optional: initialize from a pretrained SR checkpoint.
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [300000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 300000
  warmup_iter: -1

  # SR reconstruction loss
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  # Detection loss weights used by SCINetDetectionModel
  hm_weight: 1.0
  size_weight: 0.1
  off_weight: 1.0
  sr_weight: 1.0

val:
  val_freq: !!float 5000
  save_img: false
  pbar: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

