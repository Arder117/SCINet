# SCINet joint super-resolution + tiny target detection training template
name: train_SCINet_detection_x4
model_type: SCINetDetectionModel
scale: 4
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: UAV_train_det
    type: SCINetDetectionDataset
    dataroot_gt: ./data/train/gt
    dataroot_lq: ./data/train/lq
    dataroot_ann: ./data/train/ann
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: UAV_val_det
    type: SCINetDetectionDataset
    dataroot_gt: ./data/val/gt
    dataroot_lq: ./data/val/lq
    dataroot_ann: ./data/val/ann
    io_backend:
      type: disk

network_g:
  type: SCINetSmallTargetDetector
  num_in_ch: 3
  num_feat: 64
  num_block: 8
  num_out_ch: 3
  upscale: 4
  conv: BSConvU
  upsampler: pixelshuffledirect
  p: 0.25
  detector_feat: 96
  num_classes: 1

path:
  # Optional: initialize from a pretrained SR checkpoint.
  # Option A: load one full checkpoint for the joint model.
  pretrain_network_g: ~
  # Option B (staged): load SR first, then partially load detection weights.
  # pretrain_network_sr: experiments/pretrained_models/net_g_SCINet_x4.pth
  # pretrain_network_det: /path/to/centernet_or_detector_ckpt.pth
  # param_key_sr: params
  # param_key_det: state_dict
  # det_key_map:
  #   hm.0.weight: head.heatmap.weight
  #   hm.0.bias: head.heatmap.bias
  #   wh.0.weight: head.size.weight
  #   wh.0.bias: head.size.bias
  #   reg.0.weight: head.offset.weight
  #   reg.0.bias: head.offset.bias
  strict_load_g: false
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [300000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 300000
  warmup_iter: -1

  # SR reconstruction loss
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

  # Detection loss weights used by SCINetDetectionModel
  hm_weight: 1.0
  size_weight: 0.1
  off_weight: 1.0
  sr_weight: 1.0

val:
  val_freq: !!float 5000
  save_img: false
  pbar: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5000
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

