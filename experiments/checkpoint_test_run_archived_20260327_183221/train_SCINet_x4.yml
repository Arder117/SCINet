# general settings
name: checkpoint_test_run  # 修改了名字，方便你在 experiments 下一眼找到测试文件夹
model_type: SRModel
scale: 4
num_gpu: 1 
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: UAV_train_our
    type: PairedImageDataset
    dataroot_gt: /root/SCINet/data/gttrain/img
    dataroot_lq: /root/SCINet/data/lqtrain/img
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 3 
    batch_size_per_gpu: 128 # 保持 128 
    dataset_enlarge_ratio: 1 # 测试时设为 1，让进度条显示更真实
    prefetch_mode: ~

  val:
    name: UAV_valid_our
    type: PairedImageDataset
    dataroot_gt: /root/SCINet/data/gtval/img
    dataroot_lq: /root/SCINet/data/lqval/img
    io_backend:
      type: disk

# network structures (保持不变)
network_g:
  type: SCINet
  num_in_ch: 3
  num_feat: 64
  num_block: 8
  num_out_ch: 3
  upscale: 4
  conv: BSConvU

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~ 

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
    weight_decay: 0
    betas: [0.9, 0.999]

  scheduler:
    type: CosineAnnealingRestartLR
    periods: [300000]
    restart_weights: [1]
    eta_min: !!float 1e-7

  total_iter: 30000 
  warmup_iter: -1 

  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

# validation settings
val:
  val_freq: !!float 100 # 每 100 次验证一次（测试用）
  save_img: false

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 4
      test_y_channel: false

# logging settings
logger:
  print_freq: 20 # 每 20 次打印日志（测试用）
  save_checkpoint_freq: !!float 100 # 每 100 次保存一次端点（测试核心！）
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
    entity: ~








